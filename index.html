<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Biome Builders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: sticky app bar + one centred working column; each ecosystem tints its own screens through --a. */
:root {
  --bg: #F2F5F3; --surface: #FFFFFF; --sunk: #E8EDEA; --fg: #17201D; --muted: #56635E; --line: #D5DDD9;
  --brand: #22364D; --brand-fg: #FFFFFF; --good: #1C7C47; --bad: #B83A2B; --warn: #B07A0A;
  --display: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --radius: 14px;
  --a: #22364D;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #1A211E; --sunk: #232C28; --fg: #E6ECE9; --muted: #9AA8A2; --line: #303B37;
  --brand: #9FB6D8; --brand-fg: #0F1724; --good: #5DCB8C; --bad: #F08A7C; --warn: #E7B24A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --sunk: #232C28; --fg: #E6ECE9; --muted: #9AA8A2; --line: #303B37;
  --brand: #9FB6D8; --brand-fg: #0F1724; --good: #5DCB8C; --bad: #F08A7C; --warn: #E7B24A; color-scheme: dark }

.eco-rainforest { --a: #1B7A45; } .eco-desert { --a: #C7751F; } .eco-grassland { --a: #7A8F14; }
.eco-freshwater { --a: #1F7A9C; } .eco-tundra { --a: #5A5FB0; }
[class*="eco-"], .tinted { --a-ink: color-mix(in oklab, var(--a) 72%, var(--fg)); --a-soft: color-mix(in oklab, var(--a) 13%, var(--surface)); --a-line: color-mix(in oklab, var(--a) 45%, var(--line)); }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 900; }
h2 { font-size: 1.35rem; font-weight: 900; }
h3 { font-size: 1.02rem; font-weight: 800; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid color-mix(in oklab, var(--a) 60%, var(--brand)); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; box-sizing: border-box; }
textarea { min-height: 70px; resize: vertical; }
label { display: grid; gap: 4px; font-weight: 700; font-size: .86rem; color: var(--muted); }
.eyebrow { font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* app bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); color: var(--brand-fg); }
.bar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mark { font-family: var(--display); font-weight: 900; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: inherit; }
.mark svg { width: 26px; height: 26px; }
.bar .who { margin-left: auto; font-size: .85rem; opacity: .9; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; font-weight: 800; font-size: .8rem; background: var(--a-soft); color: var(--a-ink); border: 1.5px solid var(--a-line); }
.bar .chip { background: color-mix(in oklab, var(--brand-fg) 16%, var(--brand)); color: var(--brand-fg); border-color: transparent; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 20px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: .88rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-current="true"] { background: var(--a); color: #fff; border-color: var(--a); }
.tab .tick { color: var(--good); }
.tab[aria-current="true"] .tick { color: #fff; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 800; background: var(--a); color: #fff; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.ghost { background: transparent; color: var(--a-ink); border: 1.5px solid var(--a-line); }
.btn.quiet { background: var(--sunk); color: var(--fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.note { font-size: .88rem; color: var(--muted); }
.ok { color: var(--good); font-weight: 800; } .no { color: var(--bad); font-weight: 800; }

/* home */
.hero { display: grid; gap: 10px; padding-block: 10px 4px; }
.hero p { max-width: 62ch; color: var(--muted); font-size: 1.02rem; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.role { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 8px; align-content: start; }
.role:hover { border-color: var(--brand); }
.role .ic { font-size: 1.9rem; }
.role p { color: var(--muted); font-size: .9rem; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.how div { background: var(--sunk); border-radius: 12px; padding: 12px 14px; font-size: .88rem; }
.how b { display: block; font-family: var(--display); font-size: .95rem; margin-bottom: 2px; }
.ecostrip { display: flex; height: 8px; border-radius: 99px; overflow: hidden; }
.ecostrip span { flex: 1; background: var(--a); }

/* ecosystem picker */
.ecos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.eco-pick { border: 2px solid var(--a-line); background: var(--a-soft); border-radius: var(--radius); padding: 14px; text-align: left; display: grid; gap: 4px; }
.eco-pick[aria-pressed="true"] { border-color: var(--a); box-shadow: 0 0 0 3px color-mix(in oklab, var(--a) 30%, transparent); }
.eco-pick .ic { font-size: 1.8rem; } .eco-pick h3 { color: var(--a-ink); }
.eco-pick span { font-size: .82rem; color: var(--muted); }

/* expert card */
.xhead { border-radius: var(--radius); padding: 18px; color: #fff; background: linear-gradient(135deg, var(--a), color-mix(in oklab, var(--a) 60%, #000)); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.xhead .ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; background: rgba(0,0,0,.22); border: 2px solid rgba(255,255,255,.5); }
.xhead .badge { margin-left: auto; background: #fff; color: color-mix(in oklab, var(--a) 70%, #000); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: .85rem; }
.pics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pic { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: var(--a-soft); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .cap { position: absolute; left: 8px; bottom: 8px; background: var(--a); color: #fff; font-weight: 800; font-size: .76rem; padding: 4px 10px; border-radius: 999px; }
.pic.ph { display: grid; place-items: center; text-align: center; padding: 14px; background: linear-gradient(160deg, var(--a-soft), color-mix(in oklab, var(--a) 28%, var(--surface))); }
.pic.ph .big { font-size: 2.2rem; } .pic.ph p { font-size: .8rem; color: var(--muted); max-width: 32ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.fact { border: 1.5px solid var(--a-line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.fact b { display: block; background: var(--a); color: #fff; padding: 5px 10px; font-size: .8rem; }
.fact p { padding: 8px 10px; font-size: .9rem; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.link { border: 2px solid var(--k); border-radius: 10px; overflow: hidden; min-width: 120px; flex: 1; background: var(--surface); }
.link b { display: block; background: var(--k); color: #fff; font-size: .74rem; padding: 3px 8px; }
.link span { display: block; padding: 6px 8px; font-weight: 700; }
.arrow { align-self: center; font-weight: 900; color: var(--muted); }
.k-Producer { --k: #1C8A4C; } .k-Primary { --k: #C98A00; } .k-Secondary { --k: #D35B22; } .k-Tertiary { --k: #B5155A; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.list { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.list h3 { color: #fff; padding: 7px 12px; font-size: .92rem; }
.list ul { margin: 0; padding: 10px 12px 12px 30px; display: grid; gap: 4px; font-size: .92rem; }
.list.good h3 { background: #1C7C47; } .list.bad h3 { background: #B83A2B; }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.term { border: 1.5px solid var(--a-line); border-radius: 12px; padding: 9px 11px; background: var(--surface); }
.term b { color: var(--a-ink); display: block; }
.term span { font-size: .88rem; color: var(--muted); }
.mistake { border-left: 6px solid var(--warn); background: color-mix(in oklab, var(--warn) 12%, var(--surface)); border-radius: 10px; padding: 12px 14px; }
.mistake b { color: color-mix(in oklab, var(--warn) 70%, var(--fg)); }

/* quiz */
.q { display: grid; gap: 8px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; }
.opt[data-state="right"] { border-color: var(--good); background: color-mix(in oklab, var(--good) 14%, var(--surface)); }
.opt[data-state="wrong"] { border-color: var(--bad); background: color-mix(in oklab, var(--bad) 12%, var(--surface)); }
.cert { border: 2px dashed var(--a); background: var(--a-soft); border-radius: var(--radius); padding: 16px; display: flex; gap: 12px; align-items: center; }
.cert .ic { font-size: 2.2rem; }

/* passport */
.pp { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.ppbox { border: 2px solid var(--a-line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: grid; gap: 9px; }
.ppbox h3 { color: var(--a-ink); display: flex; gap: 8px; align-items: center; }
.ppbox.mine { border-color: var(--a); box-shadow: 0 0 0 3px color-mix(in oklab, var(--a) 22%, transparent); }
.chainin { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 480px) { .chainin { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* poster */
.poster-wrap { overflow-x: auto; }
.poster { width: 100%; min-width: 640px; height: auto; display: block; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.poster .piece { cursor: pointer; transition: fill-opacity .2s; }
.poster .piece:hover { fill-opacity: .32; }
.poster .piece.sel { fill-opacity: .4; stroke-width: 2.4; }
.pcard { width: 100%; height: 100%; box-sizing: border-box; background: var(--surface); border: .6px solid var(--a); border-radius: 3px; padding: 2.5px 3.5px; font: 4.1px/1.32 var(--body); color: var(--fg); overflow: hidden; }
.pcard .t { font: 900 5.4px/1.2 var(--display); color: var(--a-ink); margin-bottom: 1px; }
.pcard .l { color: var(--muted); font-weight: 800; font-size: 3.4px; text-transform: uppercase; letter-spacing: .04em; }
.pcard .e { color: var(--muted); font-style: italic; }
.hubtxt { font: 900 8px var(--display); fill: var(--fg); }
.hubsub { font: 600 4.6px var(--body); fill: var(--muted); }
.editor { border: 2px solid var(--a); }
.pieces-status { display: flex; gap: 6px; flex-wrap: wrap; }

/* sort */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: grid; gap: 4px; }
.card b { font-family: var(--display); font-size: 1rem; }
.card span { font-size: .84rem; color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklab, var(--brand) 30%, transparent); }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.zone { border: 2px solid var(--a-line); background: var(--a-soft); border-radius: var(--radius); padding: 10px; display: grid; gap: 6px; align-content: start; min-height: 120px; text-align: left; }
.zone.ready { border-style: dashed; border-color: var(--a); }
.zone h3 { color: var(--a-ink); font-size: .95rem; }
.placed { display: flex; flex-wrap: wrap; gap: 5px; }
.pchip { border: 1.5px solid var(--a-line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 700; }
.pchip.right { border-color: var(--good); } .pchip.wrong { border-color: var(--bad); color: var(--bad); }
.score { font-family: var(--display); font-weight: 900; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

/* teacher */
.stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
.clock { font-family: var(--display); font-weight: 900; font-size: clamp(3.5rem, 11vw, 7rem); line-height: 1; font-variant-numeric: tabular-nums; color: var(--a-ink); }
.clock.late { color: var(--bad); }
.progress { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--a); }
.phase-list { display: grid; gap: 4px; }
.ph-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 10px; align-items: center; }
.ph-item[aria-current="true"] { background: var(--a-soft); }
.ph-item .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--a); }
.ph-item small { color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-img { border-radius: var(--radius); width: 100%; aspect-ratio: 16 / 9; object-fit: cover; max-width: 100%; }
.big-title { font-size: clamp(1.8rem, 4.4vw, 3rem); color: var(--a-ink); }
.stage ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 1.05rem; }
.quote { font-size: 1.12rem; font-weight: 700; }
.remember { background: var(--a-soft); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.confirm { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.pop { animation: pop .25s ease-out; }
</style>

    const s = sp[st.name];
    step = `<section class="panel tinted" style="--a:var(--bad)"><h3>Found it: the ${esc(st.name)} doesn't belong in the ${esc(ECO[st.to].name)}!</h3><p class="note">Its clue: “${esc(s.clue)}”</p>
      <h3>Where does it really live?</h3><div class="row">${KEYS.filter(k => k !== st.to).map(k => `<button class="btn ${st.home === k ? "" : "ghost"} eco-${k}" data-act="stowhome" data-v="${k}">${ECO[k].icon} ${esc(ECO[k].name)}</button>`).join("")}</div>
      ${st.home ? (st.home === st.from ? `<p class="ok">Correct, it belongs in the ${esc(ECO[st.from].name)}.</p>` : `<p class="no">Not there. Look at the clue again.</p>`) : ""}
      ${st.home === st.from ? `<label for="stwhy">Write one sentence: why could it NOT survive in the ${esc(ECO[st.to].name)}? Name the adaptation that gave it away.<textarea id="stwhy" data-bind="poster.stow.why">${esc(st.why)}</textarea></label>
      <div class="row"><button class="btn" data-act="ptab" data-v="climate">Next: Climate Shift →</button><button class="btn ghost" data-act="stownew">Play another Stowaway</button></div>` : ""}</section>`;
  }
  return `<section style="display:grid;gap:6px"><span class="eyebrow">Challenge 2 · The Stowaway</span><h2>One species has sneaked into the wrong home</h2></section>${step}<div class="zones">${zones}</div>`;
}
function posterClimate() {
  const P = S.poster;
  const qs = CLIMATE.map((q, i) => { const a = P.climate[i];
    return `<div class="q"><h3>${i + 1}. ${esc(q.q)}</h3><div class="opts">${q.opts.map((o, j) => { let st = ""; if (a !== undefined && j === q.ans) st = "right"; else if (a === j) st = "wrong";
      return `<button class="opt" data-act="climate" data-q="${i}" data-v="${j}" ${a !== undefined ? "disabled" : ""} data-state="${st}">${esc(o)}</button>`; }).join("")}</div>${a !== undefined ? `<p class="note">${esc(q.why)}</p>` : ""}</div>`; }).join("");
  return `<section class="panel eco-grassland"><span class="eyebrow">Challenge 3 · Climate Shift</span><h2>Breaking news: Grassland rainfall has halved for ten years</h2>
    <figure class="pic" style="margin:0;max-width:640px"><img src="img/sheet-06-C.jpg" alt="Golden grassland drying into cracked desert"></figure>${qs}
    <label for="clnote">Which grassland species would struggle first? Why?<textarea id="clnote" data-bind="poster.climateNote">${esc(P.climateNote)}</textarea></label>
    <div class="row"><button class="btn" data-act="ptab" data-v="done">Finish: The Big Picture →</button></div></section>`;
}
function posterDone() {
  const P = S.poster; const pieces = KEYS.filter(pieceDone).length;
  const cl = CLIMATE.filter((q, i) => P.climate[i] === q.ans).length;
  const stow = P.stow && P.stow.found && P.stow.home === P.stow.from;
  const tile = (n, l) => `<div class="panel" style="gap:2px"><span class="score">${n}</span><span class="note">${l}</span></div>`;
  return `<section style="display:grid;gap:6px"><span class="eyebrow">Finale · The Big Picture</span><h2>Step back: five pieces, one planet</h2></section>
  <div class="poster-wrap">${posterSVG()}</div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${tile(`${pieces}/5`, "jigsaw pieces complete")}${tile(sortPerfect() ? `25/25` : `${DATA.species.filter(s => P.place[s.name] === s.eco).length}/25`, `species sorted${P.firstTry != null ? ` · first try ${P.firstTry}` : ""}`)}${tile(stow ? "Found" : "—", P.stow ? `stowaway (${P.stow.misses} wrong guesses)` : "stowaway not played")}${tile(`${cl}/3`, "Climate Shift answers")}</div>
  <section class="panel"><h3>Fast finishers: bonus challenges</h3><div class="two">${DATA.bonus.map(b => `<div class="list tinted" style="--a:${b.accent}"><h3 style="background:${b.accent}">${b.icon} ${esc(b.title)}</h3><div style="padding:10px 12px;display:grid;gap:6px"><b>${esc(b.q)}</b><span class="note">${esc(b.sub)}</span><ul style="padding:0 0 0 18px">${b.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul><span class="note">${esc(b.bonus)}</span></div></div>`).join("")}</div></section>
  <section class="panel"><h3>Next class</h3><p class="note">Clear this device so the next home group starts with an empty jigsaw.</p><div class="row"><button class="btn quiet" data-act="reset-poster" id="rp">Clear this poster</button></div></section>`;
}

/* ---------- teacher ---------- */
let tick;
function remaining() { const T = S.teacher; return T.endsAt ? Math.round((T.endsAt - Date.now()) / 1000) : T.remaining; }
const fmt = (s) => `${s < 0 ? "−" : ""}${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, "0")}`;
function viewTeacher() {
  const T = S.teacher; const p = DATA.phases[T.phase]; const r = remaining(); const total = PHASE_MIN[T.phase] * 60;
  let start = 0; for (let i = 0; i < T.phase; i++) start += PHASE_MIN[i];
  return `<div class="stage tinted" style="--a:${p.accent}">
    <section style="display:grid;gap:14px;min-width:0">
      <span class="eyebrow">${esc(p.tag)}</span>
      <h1 class="big-title">${esc(p.title)}</h1>
      <img class="stage-img" src="${p.img}" alt="">
      ${p.quote ? `<p class="quote">${esc(p.quote)}</p>` : ""}${p.sub ? `<p style="color:var(--a-ink);font-weight:800">${esc(p.sub)}</p>` : ""}
      <ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      ${p.exit ? `<h3>Exit ticket</h3><ol style="margin:0;padding-left:22px">${p.exit.map(b => `<li>${esc(b)}</li>`).join("")}</ol>` : ""}
      ${p.remember ? `<div class="remember">${esc(p.remember)}</div>` : ""}
    </section>
    <aside class="panel" style="position:sticky;top:76px">
      <div class="clock ${r < 0 ? "late" : ""}" id="clock" aria-live="off">${fmt(r)}</div>
      <div class="progress"><i id="prog" style="width:${Math.min(100, Math.max(0, 100 - r / total * 100))}%"></i></div>
      <div class="row"><button class="btn" data-act="tgo">${T.endsAt ? "Pause" : "Start"}</button><button class="btn quiet" data-act="tadj" data-v="-60">−1 min</button><button class="btn quiet" data-act="tadj" data-v="60">+1 min</button></div>
      <div class="row"><button class="btn ghost" data-act="tphase" data-v="${T.phase - 1}" ${T.phase ? "" : "disabled"}>← Back</button><button class="btn ghost" data-act="tphase" data-v="${T.phase + 1}" ${T.phase < 7 ? "" : "disabled"}>Next phase →</button></div>
      <div class="phase-list">${DATA.phases.map((q, i) => { let s = 0; for (let j = 0; j < i; j++) s += PHASE_MIN[j];
        return `<button class="ph-item tinted" style="--a:${q.accent}" data-act="tphase" data-v="${i}" aria-current="${i === T.phase}"><span class="dot"></span><span>${esc(q.title)}</span><small>${s}–${s + PHASE_MIN[i]} min</small></button>`; }).join("")}</div>
      ${T.phase === 5 ? `<p class="note">The Stowaway runs itself on each group's poster device: it swaps one card automatically.</p>` : ""}
    </aside></div>`;
}
function runClock() {
  clearInterval(tick);
  if (S.role !== "teacher") return;
  tick = setInterval(() => { const c = $("#clock"); if (!c) return; const r = remaining(); c.textContent = fmt(r); c.classList.toggle("late", r < 0);
    const pr = $("#prog"); if (pr) pr.style.width = Math.min(100, Math.max(0, 100 - r / (PHASE_MIN[S.teacher.phase] * 60) * 100)) + "%"; }, 250);
}
let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }

/* ---------- render + events ---------- */
function render() {
  setWho();
  app.innerHTML = S.role === "student" ? viewStudent() : S.role === "poster" ? viewPoster() : S.role === "teacher" ? viewTeacher() : viewHome();
  runClock();
}
function setPath(path, val) {
  const ks = path.split("."); let o = S;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = {}; o = o[ks[i]]; }
  o[ks.at(-1)] = val;
}
app.addEventListener("input", (ev) => {
  const b = ev.target.dataset.bind; if (!b) return; setPath(b, ev.target.value); save();
  if (b.startsWith("poster.pieces.")) { // live-update the poster without losing focus
    const wrap = document.querySelector(".poster-wrap"); if (wrap) wrap.innerHTML = posterSVG({ interactive: true });
    const sb = document.querySelector(".pieces-status"); if (sb) sb.outerHTML = `<div class="pieces-status">${KEYS.map(x => `<span class="chip eco-${x}">${ECO[x].icon} ${esc(ECO[x].name)} ${pieceDone(x) ? "✓" : "…"}</span>`).join("")}</div>`;
  }
});
let armed = null;
function arm(id, label, fn) {
  const el = document.getElementById(id);
  if (armed === id) { armed = null; fn(); return; }
  armed = id; el.textContent = label; el.classList.add("confirm");
  setTimeout(() => { if (armed === id) { armed = null; render(); } }, 4000);
}
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t || t.disabled) return;
  const a = t.dataset.act, v = t.dataset.v, P = S.poster;
  switch (a) {
    case "home": S.role = null; break;
    case "role": S.role = v; if (v === "teacher") keepAwake(); break;
    case "pickeco": S.student.eco = v; S.student.tab = "card"; window.scrollTo(0, 0); break;
    case "stab": S.student.tab = v; window.scrollTo(0, 0); break;
    case "quiz": { const k = S.student.eco; S.student.quiz[k] = S.student.quiz[k] || {}; S.student.quiz[k][t.dataset.q] = +v; break; }
    case "quizreset": S.student.quiz[S.student.eco] = {}; break;
    case "reset-student": return arm("rs", "Tap again to erase this student's work", () => { S.student = fresh().student; save(); render(); });
    case "ptab": P.tab = v; window.scrollTo(0, 0); break;
    case "selpiece": P.sel = v; setTimeout(() => document.querySelector(".editor input")?.focus(), 30); break;
    case "nextpiece": { const i = KEYS.indexOf(P.sel); P.sel = KEYS.find((k, j) => j > i && !pieceDone(k)) || KEYS.find(k => !pieceDone(k)) || null; break; }
    case "pick": P.picked = P.picked === v ? null : v; break;
    case "drop": if (!P.picked) return; P.place[P.picked] = v; P.picked = null; P.checked = false; break;
    case "unplace": ev.stopPropagation(); delete P.place[v]; P.checked = false; break;
    case "checksort": P.checked = true; if (P.firstTry == null) P.firstTry = DATA.species.filter(s => P.place[s.name] === s.eco).length; break;
    case "stowtap": if (v === P.stow.name) P.stow.found = true; else { P.stow.misses++; t.classList.add("pop"); } break;
    case "stowhome": P.stow.home = v; break;
    case "stownew": startStow(); break;
    case "climate": P.climate[t.dataset.q] = +v; break;
    case "reset-poster": return arm("rp", "Tap again to clear the whole poster", () => { S.poster = fresh().poster; save(); render(); window.scrollTo(0, 0); });
    case "tgo": { const T = S.teacher; if (T.endsAt) { T.remaining = remaining(); T.endsAt = null; } else { T.endsAt = Date.now() + T.remaining * 1000; keepAwake(); } break; }
    case "tadj": { const T = S.teacher; if (T.endsAt) T.endsAt += +v * 1000; else T.remaining += +v; break; }
    case "tphase": { const T = S.teacher; const n = Math.max(0, Math.min(7, +v)); const run = !!T.endsAt; T.phase = n; T.remaining = PHASE_MIN[n] * 60; T.endsAt = run ? Date.now() + T.remaining * 1000 : null; break; }
    default: return;
  }
  save(); render();
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
});
render();
</script>

</body></html>
